name: Interactive macOS 26 Tahoe Shell

on:
  workflow_dispatch:

jobs:
  live-terminal:
    name: Interactive Shell on macOS 26 Tahoe
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Interactive SSH Session (Upterm)
        uses: owenthereal/action-upterm@v1
        with:
          wait-timeout-minutes: 360
