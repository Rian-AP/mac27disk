name: Build macOS 27 APFS Disk Image

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct Apple CDN URL for macOS IPSW'
        required: true
        default: 'https://updates.cdn-apple.com/2026FallFCS/59241290-5d51-4ca8-9df4-31624b9a4eac/UniversalMac_27.0.1_26A434_Restore.ipsw'

jobs:
  build-disk:
    runs-on: macos-14
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipsw and start background disk cleanup
        run: |
          echo "=== 1. Starting background disk cleanup ==="
          df -h /
          sudo rm -rf /Applications/Xcode_*.app ~/Library/Caches/* &
          CLEANUP_PID=$!
          echo "Cleanup PID: $CLEANUP_PID"

          echo "=== 2. Downloading standalone ipsw binary ==="
          curl -sL "https://github.com/blacktop/ipsw/releases/download/v3.1.739/ipsw_3.1.739_macOS_arm64.tar.gz" | tar -xz -C /tmp/
          sudo mv /tmp/ipsw /usr/local/bin/
          ipsw version

          echo "=== 3. Waiting for disk cleanup to complete ==="
          wait $CLEANUP_PID || true
          df -h /

      - name: Download macOS IPSW
        run: |
          echo "=== Downloading macOS IPSW from Apple CDN ==="
          curl -L -o restore.ipsw "${{ github.event.inputs.ipsw_url }}"
          ls -lh restore.ipsw

      - name: Assemble Native APFS Disk via ASR
        run: |
          sudo python3 build_disk.py restore.ipsw

      - name: Debug session on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3

      - name: Compress and Split Disk Image
        run: |
          echo "=== Compressing target disk image with zstd ==="
          zstd -T0 -3 target_disk.dmg -o disk.raw.zst
          ls -lh disk.raw.zst
          echo "=== Splitting into 1.9 GB release chunks ==="
          split -b 1900M disk.raw.zst "disk.raw.zst.part_"
          ls -lh disk.raw.zst.part_*
          rm -f target_disk.dmg disk.raw.zst

      - name: Create GitHub Release and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v27.0.1-26A434-clean"
          gh release create "$TAG" disk.raw.zst.part_* \
            --title "macOS 27.0.1 (26A434) Native APFS Master Disk" \
            --notes "Original sealed Apple Silicon APFS disk image restored via native ASR. Ready for QEMU / Reims vGPU."
