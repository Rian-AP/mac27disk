name: Build macOS 27 APFS Disk Image

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct Apple CDN URL for macOS IPSW'
        required: true
        default: 'https://updates.cdn-apple.com/2026FallFCS/59241290-5d51-4ca8-9df4-31624b9a4eac/UniversalMac_27.0.1_26A434_Restore.ipsw'

permissions:
  contents: write

jobs:
  build-disk:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          
          echo "Removing heavy Xcode bundles to maximize disk space..."
          sudo rm -rf /Applications/Xcode*.app 2>/dev/null || true
          rm -rf ~/Library/Caches/* 2>/dev/null || true
          brew cleanup -s 2>/dev/null || true
          sudo rm -rf /usr/local/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf ~/Library/Android 2>/dev/null || true
          
          echo "=== Free Space After Cleanup ==="
          df -h

      - name: Install Tools (ipsw, zstd)
        run: |
          brew install blacktop/tap/ipsw zstd
          ipsw version

      - name: Download macOS IPSW
        run: |
          echo "Downloading IPSW from ${{ github.event.inputs.ipsw_url }}..."
          curl -L -C - --retry 5 --retry-delay 3 -o restore.ipsw "${{ github.event.inputs.ipsw_url }}"
          ls -lh restore.ipsw
          df -h

      - name: Assemble Native APFS Disk via ASR
        run: |
          chmod +x build_disk.sh
          ./build_disk.sh restore.ipsw

      - name: Compress and Split Disk Image
        run: |
          echo "Compressing disk.raw with zstd..."
          # Compress raw disk image with multi-threading
          zstd -T0 -3 disk.raw -o disk.raw.zst
          rm -f disk.raw
          echo "Splitting compressed archive into 1900MB chunks for GitHub Release limit..."
          split -b 1900M disk.raw.zst "disk.raw.zst.part_"
          rm -f disk.raw.zst
          ls -lh disk.raw.zst.part_*

      - name: Create GitHub Release and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="macos-27-disk-$(date +'%Y%m%d-%H%M%S')"
          echo "Creating Release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            disk.raw.zst.part_* \
            --title "macOS 27.0.1 (26A434) Clean APFS Disk" \
            --notes "Generated natively via Apple Software Restore (ASR) on macOS. Contains unified APFS container with Macintosh HD and Preboot (with Cryptex)."
